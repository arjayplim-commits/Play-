<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Crossroads 2006</title>
<style>
:root{--bg:#7db9e8;--panel:#d4d0c8;--edge:#404040;box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-touch-callout:none;background:var(--bg);font-family:Tahoma,Verdana,Arial,sans-serif;user-select:none}
canvas{display:block}
#logo{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;font:bold 24px "Arial Black",Arial,sans-serif;color:#fff;
  background:#1a3fa8;padding:3px 10px;border:2px solid #fff;letter-spacing:.5px}
#logo small{font:normal 11px Tahoma,sans-serif;margin-left:6px}
#help{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:10px;background:var(--panel);border:2px outset #fff;padding:6px 8px;font-size:12px;line-height:1.5;color:#000}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;
  background:var(--panel);padding:5px;border:2px outset #fff;flex-wrap:wrap;justify-content:center;max-width:96vw}
#bar button{min-width:28px;height:28px;border:2px outset #fff;background:var(--panel);font:12px Tahoma,sans-serif;cursor:pointer;padding:0 6px}
#bar button.c{width:28px;padding:0;border:2px solid #000}
#bar button.on{border:2px inset #fff;outline:2px solid #ffd800}
#joy,#jump{display:none;position:fixed;touch-action:none;bottom:calc(28px + env(safe-area-inset-bottom,0px));border-radius:50%;background:#0003;border:2px solid #fff9;color:#fff;font:bold 14px Tahoma,sans-serif;align-items:center;justify-content:center}
#joy{left:calc(24px + env(safe-area-inset-left,0px));width:120px;height:120px}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffc;pointer-events:none}
#jump{right:calc(24px + env(safe-area-inset-right,0px));width:84px;height:84px}
@media (pointer:coarse){#joy{display:block}#jump{display:flex}#help{display:none}
#bar{top:calc(108px + env(safe-area-inset-top,0px));bottom:auto;left:8px;transform:none;max-width:calc(100vw - 16px);justify-content:flex-start}}
#start{position:fixed;inset:0;z-index:10;background:linear-gradient(#5aa5e0,#a9d6f5);display:flex;align-items:center;justify-content:center;text-align:center}
#start h1{margin:0;font:bold 56px "Arial Black",Arial,sans-serif;color:#fff;background:#1a3fa8;padding:8px 24px;border:3px solid #fff;display:inline-block}
#start p{margin:10px 0 22px;color:#fff;font:bold 16px Tahoma,sans-serif;text-shadow:1px 1px 0 #0006}
#start button{font:bold 22px Tahoma,sans-serif;padding:8px 40px;border:3px outset #fff;background:#d4d0c8;cursor:pointer}
#name{margin-top:14px}
#name input{font:14px Tahoma,sans-serif;padding:6px 8px;border:2px inset #fff;width:200px;text-align:center}
#chatlog{position:fixed;left:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(360px,60vw);max-height:34vh;overflow:hidden;
  display:flex;flex-direction:column-reverse;gap:2px;pointer-events:none;font:12px Tahoma,sans-serif}
#chatlog div{background:#000a;color:#fff;padding:3px 7px;border-radius:3px;max-width:100%;word-break:break-word}
#chatlog div b{color:#ffd800}
#chatbox{display:none;position:fixed;left:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(360px,60vw);z-index:9}
#chatbox input{width:100%;box-sizing:border-box;font:13px Tahoma,sans-serif;padding:6px 8px;border:2px inset #fff}
#plist{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;background:#0007;color:#fff;font:12px Tahoma,sans-serif;
  padding:5px 9px;border-radius:4px;max-width:160px}
#plist b{color:#8f8}
#chatbtn{display:none;position:fixed;touch-action:none;left:calc(24px + env(safe-area-inset-left,0px));top:calc(52px + env(safe-area-inset-top,0px));
  width:44px;height:44px;border-radius:8px;background:#0006;border:2px solid #fff9;color:#fff;font:20px Tahoma,sans-serif;align-items:center;justify-content:center;cursor:pointer;z-index:9}
@media (pointer:coarse){#chatbtn{display:flex}}
#chatrow{display:flex;gap:4px}
#chatbox button{font:bold 12px Tahoma,sans-serif;padding:0 12px;border:2px outset #fff;background:#d4d0c8;cursor:pointer}
#netstat{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));right:10px;background:#0007;color:#ffd800;font:11px Tahoma,sans-serif;padding:2px 8px;border-radius:4px;display:none}
#avbtn{position:fixed;top:calc(40px + env(safe-area-inset-top,0px));right:10px;background:var(--panel);
  border:2px outset #fff;padding:5px 10px;font:bold 12px Tahoma,sans-serif;color:#000;cursor:pointer;z-index:9}
#avpanel{display:none;position:fixed;top:calc(72px + env(safe-area-inset-top,0px));right:10px;width:190px;background:var(--panel);
  border:2px outset #fff;padding:8px;font:12px Tahoma,sans-serif;color:#000;z-index:9}
#avparts{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
#avparts button{flex:1 1 40%;font:11px Tahoma,sans-serif;padding:4px 2px;border:2px outset #fff;background:#fff;cursor:pointer}
#avparts button.on{border:2px inset #fff;background:#ffd800}
#avrgb label{display:flex;align-items:center;gap:6px;font:11px Tahoma,sans-serif;margin:3px 0}
#avrgb input[type=range]{flex:1}
#avswatch{width:100%;height:22px;border:2px inset #fff;margin:6px 0}
#avclose{width:100%;font:bold 11px Tahoma,sans-serif;padding:4px;border:2px outset #fff;background:#d4d0c8;cursor:pointer}
#avnote{font-size:10px;color:#555;margin-top:4px;text-align:center}
</style>
</head>

  fp.setX(i,fp.getX(i)*r);fp.setZ(i,fp.getZ(i)*r);}
const faceMesh=new THREE.Mesh(fg,new THREE.MeshBasicMaterial({map:faceTex,transparent:true,depthWrite:false}));
head.add(faceMesh);
const box=new THREE.BoxGeometry(1,2,1);
const aL=part(box,0xf5cd30,-1.5,4,0,1),aR=part(box,0xf5cd30,1.5,4,0,1);
const lL=part(box,0x4b974b,-0.5,2,0,1),lR=part(box,0x4b974b,0.5,2,0,1);
S.add(P);
// Player: custom per-axis (X, Y, Z) AABB collision against every brick, ball and the baseplate
const pb={position:new THREE.Vector3(),velocity:new THREE.Vector3(),wakeUp(){},angularVelocity:{set(){}}};
let lastGround=-1,T=0;const AX=['x','y','z'],HALF=[0.8,2.5,0.8];
function updateAABBs(){const ab=Math.abs;for(const o of objs){const b=o.body,sh=b.shapes[0];let hx,hy,hz;
  if(sh.radius!==undefined){hx=hy=hz=sh.radius;}else{const h=sh.halfExtents,q=b.quaternion,x=q.x,y=q.y,z=q.z,w=q.w;
    hx=ab(1-2*(y*y+z*z))*h.x+ab(2*(x*y-z*w))*h.y+ab(2*(x*z+y*w))*h.z;
    hy=ab(2*(x*y+z*w))*h.x+ab(1-2*(x*x+z*z))*h.y+ab(2*(y*z-x*w))*h.z;
    hz=ab(2*(x*z-y*w))*h.x+ab(2*(y*z+x*w))*h.y+ab(1-2*(x*x+y*y))*h.z;}
  const c=b.position;o.lo=[c.x-hx,c.y-hy,c.z-hz];o.hi=[c.x+hx,c.y+hy,c.z+hz];}}
const over=o=>{const p=pb.position;return p.x+.8>o.lo[0]&&p.x-.8<o.hi[0]&&p.y+2.5>o.lo[1]&&p.y-2.5<o.hi[1]&&p.z+.8>o.lo[2]&&p.z-.8<o.hi[2];};
function movePlayer(dt){
  const p=pb.position,v=pb.velocity;v.y+=W.gravity.y*dt;
  v.x=Math.max(-70,Math.min(70,v.x));v.y=Math.max(-150,Math.min(150,v.y));v.z=Math.max(-70,Math.min(70,v.z));
  const n=Math.min(20,Math.ceil(Math.max(Math.abs(v.x),Math.abs(v.y),Math.abs(v.z))*dt/0.4)||1),h=dt/n;
  for(let s=0;s<n;s++)for(let i=0;i<3;i++){const k=AX[i];if(!v[k])continue;p[k]+=v[k]*h;
    for(const o of objs){if(!over(o))continue;
      const up=v[k]>0;p[k]=up?o.lo[i]-HALF[i]:o.hi[i]+HALF[i];
      if(i===1){if(!up)lastGround=T;v.y=(!up&&o.tramp)?80:0;}
      else{if(o.body.mass){o.body.wakeUp();o.body.velocity[k]+=(v[k]*0.9-o.body.velocity[k])*0.6;}v[k]=0;}}
    if(i===1&&p.y-2.5<0&&Math.abs(p.x)<128&&Math.abs(p.z)<128){p.y=2.5;if(v.y<0)v.y=0;lastGround=T;}}
  // bricks that moved into the player: push out along the shallowest axis
  for(let pass=0;pass<2;pass++)for(const o of objs){if(!over(o))continue;
    let best=1e9,bi=0,dirn=0;
    for(let i=0;i<3;i++){const k=AX[i],lo=o.lo[i]-HALF[i]-p[k],hi=o.hi[i]+HALF[i]-p[k];
      if(-lo<best){best=-lo;bi=i;dirn=lo;}if(hi<best){best=hi;bi=i;dirn=hi;}}
    const k=AX[bi];p[k]+=dirn;
    if(bi===1){if(dirn>0){lastGround=T;if(v.y<0)v.y=0;}else if(v.y>0)v.y=0;}
    else if(o.body.mass){v[k]+=o.body.velocity[k]*0.6;o.body.velocity[k]*=0.6;}}
}
function respawn(){pb.position.set(0,6,0);pb.velocity.set(0,0,0);}respawn();

// Input
const K={};let yaw=0.6,pitch=0.35,dist=18,drag=false,lx=0,ly=0,anchor=false,face=0,walk=0;

addEventListener('keyup',e=>K[e.code]=false);
R.domElement.addEventListener('contextmenu',e=>e.preventDefault());

addEventListener('mousemove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*0.006;pitch=Math.max(-0.2,Math.min(1.4,pitch+(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;});

// Touch controls: joystick, jump, drag to look, pinch to zoom, tap to build
const joy=document.getElementById('joy'),knob=document.getElementById('knob'),jump=document.getElementById('jump');
let jx=0,jy=0,jid=null;
function jset(t){const r=joy.getBoundingClientRect();let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
  const m=Math.hypot(dx,dy),max=45;if(m>max){dx*=max/m;dy*=max/m;}knob.style.transform=`translate(${dx}px,${dy}px)`;
  jx=Math.abs(dx)>10?dx/max:0;jy=Math.abs(dy)>10?dy/max:0;}
const byId=(l,id)=>[...l].find(t=>t.identifier===id);
joy.addEventListener('touchstart',e=>{e.preventDefault();jid=e.changedTouches[0].identifier;jset(e.changedTouches[0]);},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();const t=byId(e.touches,jid);if(t)jset(t);},{passive:false});
const jend=e=>{if(byId(e.changedTouches,jid)){jid=null;jx=jy=0;knob.style.transform='';}};
joy.addEventListener('touchend',jend);joy.addEventListener('touchcancel',jend);
jump.addEventListener('touchstart',e=>{e.preventDefault();K.Space=true;},{passive:false});
jump.addEventListener('touchend',()=>K.Space=false);jump.addEventListener('touchcancel',()=>K.Space=false);
const tt={},cv=R.domElement;let pd=0;
const d2=()=>{const a=Object.values(tt);return a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0;};
cv.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)tt[t.identifier]={x:t.clientX,y:t.clientY,sx:t.clientX,sy:t.clientY,t:Date.now()};pd=d2();},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();
  for(const t of e.changedTouches){const o=tt[t.identifier];if(!o)continue;
    if(Object.keys(tt).length===1){yaw-=(t.clientX-o.x)*0.008;pitch=Math.max(-0.2,Math.min(1.4,pitch+(t.clientY-o.y)*0.006));}
    o.x=t.clientX;o.y=t.clientY;}
  if(Object.keys(tt).length>1){const d=d2();dist=Math.max(4,Math.min(60,dist-(d-pd)*0.08));pd=d;}},{passive:false});
const tend=e=>{e.preventDefault();for(const t of e.changedTouches){delete tt[t.identifier];}pd=d2();};
cv.addEventListener('touchend',tend,{passive:false});cv.addEventListener('touchcancel',tend,{passive:false});

// Explosions and gravity
const fx=[];
function boom(){
  const cx=pb.position.x+Math.sin(face)*6,cy=pb.position.y,cz=pb.position.z+Math.cos(face)*6,RAD=16;
  const hit=b=>{const dx=b.position.x-cx,dy=b.position.y-cy,dz=b.position.z-cz,d=Math.hypot(dx,dy,dz)||0.1;if(d>RAD)return;
    const s=(1-d/RAD)*70;b.wakeUp();b.velocity.x+=dx/d*s;b.velocity.y+=dy/d*s+s*0.4;b.velocity.z+=dz/d*s;
    b.angularVelocity.set((Math.random()-.5)*8,(Math.random()-.5)*8,(Math.random()-.5)*8);};
  for(const o of objs)if(o.body.mass)hit(o.body);hit(pb);
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xffa020,transparent:true,opacity:.8}));
  m.position.set(cx,cy+1,cz);S.add(m);fx.push({m,t:0});
}
const GR=[['Moon',30],['Normal',100],['Heavy',250]];let gi=1;
const gb=document.createElement('button');gb.textContent='Gravity: Normal';
gb.onclick=()=>{gi=(gi+1)%3;W.gravity.set(0,-GR[gi][1],0);gb.textContent='Gravity: '+GR[gi][0];objs.forEach(o=>o.body.wakeUp());};bar.appendChild(gb);
const xb=document.createElement('button');xb.textContent='Explode';xb.onclick=boom;bar.appendChild(xb);

// ===== Safe Chat: filters censored words before showing or sending a message =====
const BADWORDS=['fuck','shit','bitch','asshole','bastard','cunt','dick','pussy','whore','slut','nigger','nigga','faggot','fag','retard','rape','porn','sex','cock','damn','crap'];
const badRe=new RegExp('\\b('+BADWORDS.map(w=>w.replace(/[aeiou]/g,'$&?')).join('|')+')\\b','gi');
function safeChat(t){return String(t||'').replace(badRe,m=>'*'.repeat(m.length)).slice(0,150);}
function escapeHtml(t){return String(t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// ===== Multiplayer (Claude Artifact "room" capability: live presence + chat) =====
let myName='Guest',room=null,netOn=false;
const avatarColors={torso:'#1a5fb4',armL:'#f5cd30',armR:'#f5cd30',legL:'#4b974b',legR:'#4b974b'};
const bodyParts={torso:torsoMesh,armL:aL.children[0],armR:aR.children[0],legL:lL.children[0],legR:lR.children[0]};
function applyColor(part,hex){avatarColors[part]=hex;bodyParts[part].material.color.set(hex);}
const peers={};const pcountEl=document.getElementById('pcount');
function ghostChar(ac){ac=ac||{};const g=new THREE.Group();const mt=c=>new THREE.MeshLambertMaterial({color:c||'#1a5fb4'});
  const t=new THREE.Mesh(new THREE.BoxGeometry(2,2,1),mt(ac.t));t.position.y=3;g.add(t);
  const h=new THREE.Mesh(headGeo(),mt('#f5cd30'));h.position.y=5.0;g.add(h);
  const bx=new THREE.BoxGeometry(1,2,1);
  const al=new THREE.Mesh(bx,mt(ac.al||'#f5cd30'));al.position.set(-1.5,4,0);g.add(al);
  const ar=new THREE.Mesh(bx,mt(ac.ar||'#f5cd30'));ar.position.set(1.5,4,0);g.add(ar);
  const ll=new THREE.Mesh(bx,mt(ac.ll||'#4b974b'));ll.position.set(-0.5,2,0);g.add(ll);
  const lr=new THREE.Mesh(bx,mt(ac.lr||'#4b974b'));lr.position.set(0.5,2,0);g.add(lr);
  const c=document.createElement('canvas');c.width=256;c.height=48;const ctx=c.getContext('2d');
  const tag=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));
  tag.position.y=7;tag.scale.set(4,0.75,1);g.add(tag);
  return{g,tag,ctx,tex:tag.material.map,label:'',parts:{t,al,ar,ll,lr},colorKey:''};}
function setLabel(ph,name){if(ph.label===name)return;ph.label=name;const c=ph.ctx.canvas;ph.ctx.clearRect(0,0,c.width,c.height);
  ph.ctx.font='bold 26px Tahoma,sans-serif';ph.ctx.textAlign='center';ph.ctx.fillStyle='#000a';ph.ctx.fillText(name,c.width/2+1,33);
  ph.ctx.fillStyle='#fff';ph.ctx.fillText(name,c.width/2,32);ph.tex.needsUpdate=true;}
function refreshPeers(){if(!room)return;const list=room.peers(),seen=new Set();
  for(const p of list){if(p.isMe)continue;const pr=p.presence||{};if(typeof pr.x!=='number')continue;
    seen.add(p.peer);if(!peers[p.peer]){peers[p.peer]=ghostChar(pr.ac);S.add(peers[p.peer].g);}
    const ph=peers[p.peer],ck=JSON.stringify(pr.ac||{});
    if(ph.colorKey!==ck){ph.colorKey=ck;const a=pr.ac||{};
      ph.parts.t.material.color.set(a.t||'#1a5fb4');ph.parts.al.material.color.set(a.al||'#f5cd30');
      ph.parts.ar.material.color.set(a.ar||'#f5cd30');ph.parts.ll.material.color.set(a.ll||'#4b974b');ph.parts.lr.material.color.set(a.lr||'#4b974b');}
    ph.tgt={x:pr.x,y:pr.y,z:pr.z,f:pr.f||0};setLabel(ph,safeChat(pr.name||'Guest'));}
  for(const id in peers)if(!seen.has(id)){S.remove(peers[id].g);delete peers[id];}
  pcountEl.textContent=Object.keys(peers).length+1;}
let lastSend=0;
function sendPresence(){if(!room)return;const a=avatarColors;room.presence({name:myName,x:pb.position.x,y:pb.position.y,z:pb.position.z,f:face,ac:{t:a.torso,al:a.armL,ar:a.armR,ll:a.legL,lr:a.legR}}).catch(()=>{});}
const netstat=document.getElementById('netstat');
async function netStart(){netstat.style.display='block';netstat.textContent='Connecting…';
  try{room=await claude.use('room');}catch(e){room=null;}
  if(!room){netstat.textContent='Multiplayer unavailable here';setTimeout(()=>netstat.style.display='none',4000);pcountEl.parentElement.style.display='none';return;}
  netOn=true;netstat.style.display='none';
  room.onConnection(c=>{netstat.style.display=c?'none':'block';netstat.textContent=c?'':'Reconnecting…';});
  room.onPeers(()=>refreshPeers());
  room.on('chat',msg=>{if(msg&&msg.isMe)return;const d=(msg&&msg.data)||{};showChatLine(safeChat(d.n),safeChat(d.m));},
    ()=>{netstat.textContent='Chat unavailable';netstat.style.display='block';});
  sendPresence();}
async function sendChat(text){const clean=safeChat(text).trim();if(!clean)return;
  if(!room){showChatLine('System','Not connected yet — try again in a second.');return;}
  showChatLine(safeChat(myName),clean); // show locally right away (you also get your own emit echoed back)
  try{await room.emit('chat',{n:safeChat(myName),m:clean});}
  catch(e){const msg=e&&e.code==='not_permitted'?'You don\'t have permission to chat here.':'Message failed to send — try again.';showChatLine('System',msg);}}
const chatlog=document.getElementById('chatlog');
function showChatLine(name,msg){const d=document.createElement('div');d.innerHTML='<b>'+escapeHtml(name)+':</b> '+escapeHtml(msg);
  chatlog.prepend(d);while(chatlog.children.length>8)chatlog.removeChild(chatlog.lastChild);
  setTimeout(()=>{d.style.transition='opacity .6s';d.style.opacity=0;setTimeout(()=>d.remove(),600);},7000);}

// Avatar customizer: pick a body part, dial in RGB, face stays fixed
const avbtn=document.getElementById('avbtn'),avpanel=document.getElementById('avpanel'),avswatch=document.getElementById('avswatch');
const rR=document.getElementById('rR'),rG=document.getElementById('rG'),rB=document.getElementById('rB');
const avBtns=[...document.querySelectorAll('#avparts button')];let avPart='torso',avOpen=false;
const hexToRgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];};
const rgbToHex=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
function selectPart(p){avPart=p;avBtns.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  const[r,g,b]=hexToRgb(avatarColors[p]);rR.value=r;rG.value=g;rB.value=b;avswatch.style.background=avatarColors[p];}
function updateSwatch(){const hex=rgbToHex(+rR.value,+rG.value,+rB.value);avswatch.style.background=hex;applyColor(avPart,hex);}
avBtns.forEach(b=>b.addEventListener('click',()=>selectPart(b.dataset.p)));
[rR,rG,rB].forEach(inp=>inp.addEventListener('input',updateSwatch));
avbtn.addEventListener('click',()=>{avOpen=!avOpen;avpanel.style.display=avOpen?'block':'none';if(avOpen)selectPart(avPart);});
document.getElementById('avclose').addEventListener('click',()=>{avOpen=false;avpanel.style.display='none';});

// Chat box UI
const chatbox=document.getElementById('chatbox'),cin=document.getElementById('cin'),chatbtn=document.getElementById('chatbtn');
let chatOpen=false;
function openChat(){chatOpen=true;chatbox.style.display='block';cin.value='';cin.focus();}
function closeChat(send){if(send&&cin.value.trim())sendChat(cin.value);chatOpen=false;chatbox.style.display='none';cin.blur();}
addEventListener('keydown',e=>{if(chatOpen){if(e.code==='Enter')closeChat(true);else if(e.code==='Escape')closeChat(false);e.stopPropagation();}
  else if(e.code==='Enter'){e.preventDefault();openChat();}},true);
chatbtn.addEventListener('click',()=>chatOpen?closeChat(true):openChat());
chatbtn.addEventListener('touchstart',e=>{e.preventDefault();chatOpen?closeChat(true):openChat();},{passive:false});
document.getElementById('csend').addEventListener('click',()=>closeChat(true));

// Loop
const clock=new THREE.Clock();
function loop(){
try{
  const dt=Math.min(clock.getDelta(),0.05);T+=dt;
  if(K.KeyQ)yaw+=dt*2;if(K.KeyE)yaw-=dt*2;
  let ix=(chatOpen||avOpen)?0:(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),iz=(chatOpen||avOpen)?0:(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);ix+=jx;iz+=jy;
  const moving=!!(ix||iz),ground=T-lastGround<0.12;
  let tx=0,tz=0;if(moving){const l=Math.hypot(ix,iz);ix/=l;iz/=l;
    const dx=ix*Math.cos(yaw)+iz*Math.sin(yaw),dz=-ix*Math.sin(yaw)+iz*Math.cos(yaw);
    tx=dx*16;tz=dz*16;face=Math.atan2(dx,dz);}
  const kk=Math.min(1,dt*(ground?14:5));pb.velocity.x+=(tx-pb.velocity.x)*kk;pb.velocity.z+=(tz-pb.velocity.z)*kk;
  if(K.Space&&ground&&!chatOpen&&!avOpen){pb.velocity.y=38;lastGround=-1;}
  W.step(1/60,dt,3);updateAABBs();movePlayer(dt);
  for(let i=objs.length-1;i>=0;i--){const o=objs[i];
    if(o.body.position.y<-60){W.removeBody(o.body);S.remove(o.mesh);pick.splice(pick.indexOf(o.mesh),1);objs.splice(i,1);continue;}
    o.mesh.position.copy(o.body.position);o.mesh.quaternion.copy(o.body.quaternion);}
  if(pb.position.y<-60)respawn();
  P.position.set(pb.position.x,pb.position.y-2.5,pb.position.z);
  P.rotation.y+=(((face-P.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI)*Math.min(1,dt*15);
  const t=P.position.clone();t.y+=3.5;
  C.position.set(t.x+Math.sin(yaw)*Math.cos(pitch)*dist,t.y+Math.sin(pitch)*dist,t.z+Math.cos(yaw)*Math.cos(pitch)*dist);
  C.lookAt(t);sun.target.position.copy(P.position);sun.position.set(P.position.x+40,80,P.position.z+30);
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;const k=f.t/0.35;f.m.scale.setScalar(1+k*13);f.m.material.opacity=0.8*(1-Math.min(k,1));if(k>=1){S.remove(f.m);fx.splice(i,1);}}
  if(netOn&&T-lastSend>0.12){lastSend=T;sendPresence();}
  for(const id in peers){const ph=peers[id];if(!ph.tgt)continue;const k=Math.min(1,dt*8);
    ph.g.position.x+=(ph.tgt.x-ph.g.position.x)*k;ph.g.position.y+=(ph.tgt.y-2.5-ph.g.position.y)*k;ph.g.position.z+=(ph.tgt.z-ph.g.position.z)*k;
    let dr=((ph.tgt.f-ph.g.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;ph.g.rotation.y+=dr*Math.min(1,dt*10);}
  R.render(S,C);
}catch(err){console.error('Crossroads frame error:',err);}
requestAnimationFrame(loop);
}
const fit=()=>{R.setPixelRatio(Math.min(window.devicePixelRatio||1,3));R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();};
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));
loop();
